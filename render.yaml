services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: weathermind-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./weather.db
      - key: YOUTUBE_API_KEY
        sync: false

  # 2. React Vite Frontend Static Site
  - type: static
    name: weathermind-ui
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://weathermind-u12d.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

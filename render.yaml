services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: weathermind-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./weather.db
      - key: YOUTUBE_API_KEY
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: weathermind-ui
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: weathermind-api
          property: host

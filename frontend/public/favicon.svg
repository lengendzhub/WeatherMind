<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (visionOS deep sky to twilight) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="55%" stop-color="#0062E0" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>

    <!-- Warm Golden Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- Volumetric Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2EAF4" />
    </linearGradient>

    <!-- Cloud Soft Drop Shadow -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#001433" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Apple visionOS Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#skyGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />

  <!-- Radiant Golden Sun -->
  <circle cx="41" cy="22" r="11" fill="url(#sunGrad)" />
  
  <!-- Subtle Solar Rays -->
  <g stroke="url(#sunGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
    <line x1="41" y1="7" x2="41" y2="9.5" />
    <line x1="53" y1="13" x2="51" y2="15" />
    <line x1="56" y1="22" x2="53.5" y2="22" />
    <line x1="52" y1="30" x2="50" y2="28.5" />
  </g>

  <!-- Frosted Weather Cloud -->
  <g filter="url(#cloudShadow)">
    <path d="M19 46 h26 a8 8 0 0 0 3.5 -15.2 a11.5 11.5 0 0 0 -21.8 -3.2 a9 9 0 0 0 -10.7 9.4 a8 8 0 0 0 3 9 z" fill="url(#cloudGrad)" />
  </g>

  <!-- Travel Jet Flight Path & Accent -->
  <path d="M14 42 Q 25 33 36 24" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-dasharray="2 2" stroke-linecap="round" />
  <g transform="translate(36, 24) rotate(42) scale(0.9)">
    <path d="M0 -7 L4 4 L0 2 L-4 4 Z" fill="#FFFFFF" />
  </g>
</svg>
